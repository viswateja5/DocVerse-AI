services:
  - type: web
    name: docverse-ai
    runtime: docker
    plan: free
    dockerCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///vector_store/chat_history.db
      - key: REDIS_URL
        sync: false

  - type: web
    name: docverse-ai-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://docverse-ai.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
